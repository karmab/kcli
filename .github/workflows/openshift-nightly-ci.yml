name: OPENSHIFT-NIGHTLY-CI
on:
  schedule:
    - cron: '01 18 * * *'

env:
 HOME: /root
 PYTHONUNBUFFERED: true
 CLUSTER: ci
 PULLSECRET: /root/openshift_pull.json

jobs:
  deploy-openshift:
    if: github.repository == 'karmab/kcli'
    runs-on: u09
    steps:
     - uses: actions/checkout@v2
     - run: git pull origin ${GITHUB_REF##*/}
     - name: Install kcli
       run: curl https://raw.githubusercontent.com/karmab/kcli/main/install.sh | bash
     - name: Delete old install
       run: kcli delete cluster --yes $CLUSTER || true
     - name: Deploy Openshift on libvirt
       run: kcli create cluster openshift --paramfile openshift-ci-paramfiles/libvirt.yml -P pull_secret=$PULLSECRET $CLUSTER --force
