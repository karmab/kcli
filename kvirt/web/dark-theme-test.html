<!DOCTYPE html>
<html class="layout-pf theme-dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kcli dark theme test</title>
    <link href="/static/css/kcli.css" rel="stylesheet">
    <link href="/static/css/dark-theme.css" rel="stylesheet">
</head>
<body>
<nav role="navigation" class="navbar navbar-custom">
    <div class="navbar-header">
        <a href="#" class="navbar-brand"><img src="/static/images/kcli-small.png" width=35 height=35 alt="Kcli" /></a>
    </div>
    <div id="navbarCollapse" class="collapse navbar-collapse">
        <ul class="nav navbar-nav navbar-right">
            <li class="dropdown">
                <a href="#" class="dropdown-toggle" data-toggle="dropdown" id="themeDropdown">
                    <span id="themeIcon">🌙</span> <span id="themeLabel">Dark</span> <b class="caret"></b>
                </a>
                <ul class="dropdown-menu">
                    <li><a href="#" data-theme="light">Light</a></li>
                    <li><a href="#" data-theme="dark">Dark</a></li>
                </ul>
            </li>
        </ul>
        <p class="navbar-text navbar-right">Current Client: default</p>
    </div>
</nav>
<table class="table table-striped table-bordered">
    <thead><tr><th>Name</th><th>Status</th></tr></thead>
    <tbody><tr><td class="vert-align">vm1</td><td class="green">up</td></tr><tr><td>vm2</td><td class="red">down</td></tr></tbody>
</table>
<form>
    <input class="form-control" placeholder="text input">
    <select class="form-control"><option>opt1</option></select>
    <button class="btn btn-default">Default</button>
    <button class="btn btn-primary">Primary</button>
</form>
<div class="loader"></div>
<div class="dropdown-menu"><li><a href="#">dropdown item</a></li></div>
<!-- Simulate the user having selected the Dark theme via the step-01 selector: persist choice, then theme.js applies it on DOMContentLoaded -->
<script>localStorage.setItem('kweb-theme','dark');</script>
<script src="/static/js/theme.js"></script>
<script>
window.addEventListener('load', function(){
    // report computed colors for key elements
    var report = {};
    function color(sel){ var e=document.querySelector(sel); return e? window.getComputedStyle(e).color : null; }
    function bg(sel){ var e=document.querySelector(sel); return e? window.getComputedStyle(e).backgroundColor : null; }
    report.bodyBg = bg('body');
    report.bodyColor = color('body');
    report.tableBg = bg('table');
    report.tableTdColor = color('table td');
    report.navbarBg = bg('.navbar-custom');
    report.navbarBrandColor = color('.navbar-brand');
    report.dropdownBg = bg('.dropdown-menu');
    report.inputBg = bg('.form-control');
    report.inputColor = color('.form-control');
    report.btnDefaultBg = bg('.btn-default');
    report.btnDefaultColor = color('.btn-default');
    report.btnPrimaryBg = bg('.btn-primary');
    document.getElementById('report').textContent = JSON.stringify(report, null, 2);
});
</script>
<pre id="report"></pre>
</body>
</html>
